[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "xau-trading-platform"
version = "0.1.0"
description = "Phase 1 core contracts for XAUUSD trading platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "structlog>=24.4,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.7,<0.9",
  "mypy>=1.11,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["packages/trading_core/src/trading_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "packages/trading_core/src"
